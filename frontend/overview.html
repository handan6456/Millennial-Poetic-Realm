<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>千年诗境 · 诗词数据概览</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 数字卡片行 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255, 253, 247, 0.9);
            border: 1px solid rgba(201, 169, 110, 0.4);
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            position: relative;
        }
        .stat-card::before, .stat-card::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border: 2px solid var(--gold);
        }
        .stat-card::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .stat-card::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        .stat-card .num {
            font-size: 32px;
            color: var(--ink-blue);
            font-weight: bold;
            font-family: "STKaiti", serif;
        }
        .stat-card .label {
            font-size: 13px;
            color: #8b7355;
            margin-top: 6px;
            letter-spacing: 2px;
        }
        @media (max-width: 900px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body data-page="overview">
    <nav class="nav">
        <a href="index.html" class="logo">千年诗境</a>
        <a href="dynasty.html" data-page="dynasty">朝代分析</a>
        <a href="poet.html" data-page="poet">诗人图谱</a>
        <a href="text.html" data-page="text">诗词文本分析</a>
        <a href="imagery.html" data-page="imagery">诗境意象</a>
        <a href="overview.html" data-page="overview">诗词数据概览</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>诗词数据概览</h1>
            <p>诗词类型与结构分析</p>
        </div>

        <!-- 数字卡片 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="num" id="statTotal">—</div>
                <div class="label">诗词总数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statCategory">—</div>
                <div class="label">诗词类别数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statAvgLen">—</div>
                <div class="label">平均字数</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statTopCat">—</div>
                <div class="label">最常见类别</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <h3>各诗词类别数量（点击扇区下钻）</h3>
                <div id="categoryPie" class="chart"></div>
            </div>
            <div class="card">
                <h3>诗词类别 TopN</h3>
                <div id="categoryTop" class="chart"></div>
            </div>
        </div>

        <div class="card" style="margin-top:20px;">
            <h3>朝代 × 类别 分布（可点击图例筛选）</h3>
            <div id="dynastyCategory" class="chart" style="height:400px;"></div>
        </div>

        <div class="card">
            <h3>诗词长度区间分布（含平均线）</h3>
            <div id="lengthRange" class="chart"></div>
        </div>
    </div>

<script src="js/common.js"></script>
<script>
// ============ 模拟数据 ============
const categoryCount = {
    "古体诗": 52341, "近体诗": 38920, "词": 8200,
    "绝句": 6500, "律诗": 4200, "乐府": 1800, "其他": 1500
};
const categoryTopN = Object.entries(categoryCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
const dynasties = ["唐代", "宋代", "元代", "明代", "清代", "魏晋", "先秦"];
const categories = ["古体诗", "近体诗", "词", "绝句", "律诗"];
const dynastyCategoryData = {
    "古体诗": [18200, 9800, 2100, 7600, 8900, 3200, 541],
    "近体诗": [15600, 11200, 980, 4300, 5800, 800, 20],
    "词":     [1200,  6800,  400,  100,  300,  50,  50],
    "绝句":   [3200,  2100,  300,  400,  450,   50,   0],
    "律诗":   [2800,  1500,  120,  300,  500,   30,   0]
};
const lengthRangeData = {
    "0-20": 12000, "21-50": 45000, "51-100": 32000, "101-200": 15000, "200+": 5643
};

// ============ 顶部数字卡片 ============
const total = Object.values(categoryCount).reduce((a, b) => a + b, 0);
const topCat = categoryTopN[0][0];
const avgLen = Math.round(
    (0*12000 + 35*45000 + 75*32000 + 150*15000 + 250*5643) / total
);
document.getElementById('statTotal').textContent = total.toLocaleString();
document.getElementById('statCategory').textContent = Object.keys(categoryCount).length;
document.getElementById('statAvgLen').textContent = avgLen + ' 字';
document.getElementById('statTopCat').textContent = topCat;

// ============ 1. 饼图（点击下钻） ============
const pieChart = echarts.init(document.getElementById('categoryPie'));
pieChart.setOption({
    tooltip: { trigger: 'item', formatter: '{b}: {c} 首 ({d}%)' },
    legend: { bottom: 0, type: 'scroll' },
    color: THEME_COLORS,
    series: [{
        type: 'pie', radius: ['40%', '70%'],
        label: { show: true, formatter: '{b}\n{d}%' },
        data: Object.entries(categoryCount).map(([name, value]) => ({ name, value }))
    }]
});
// 点击饼图扇区，alert该类别详情（下钻效果）
pieChart.on('click', function(params) {
    alert(`【${params.name}】\n数量：${params.value} 首\n占比：${params.percent}%`);
});

// ============ 2. TopN 横向条形图 ============
echarts.init(document.getElementById('categoryTop')).setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    grid: { left: 80, right: 40, top: 10, bottom: 30 },
    xAxis: { type: 'value' },
    yAxis: { type: 'category', data: categoryTopN.map(x => x[0]).reverse() },
    series: [{
        type: 'bar', data: categoryTopN.map(x => x[1]).reverse(),
        itemStyle: { color: '#77171C', borderRadius: [0, 4, 4, 0] },
        label: { show: true, position: 'right' }
    }]
});

// ============ 3. 堆叠图（legend可筛选） ============
echarts.init(document.getElementById('dynastyCategory')).setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    legend: { data: categories, top: 0, selectedMode: 'multiple' },
    grid: { left: 60, right: 30, top: 40, bottom: 30 },
    xAxis: { type: 'category', data: dynasties },
    yAxis: { type: 'value', name: '数量' },
    color: THEME_COLORS,
    series: categories.map(cat => ({
        name: cat, type: 'bar', stack: 'total', data: dynastyCategoryData[cat]
    }))
});

// ============ 4. 长度区间（加平均线） ============
const ranges = Object.keys(lengthRangeData);
const counts = Object.values(lengthRangeData);
echarts.init(document.getElementById('lengthRange')).setOption({
    tooltip: { trigger: 'axis' },
    grid: { left: 60, right: 60, top: 30, bottom: 30 },
    xAxis: { type: 'category', data: ranges, name: '字数区间' },
    yAxis: { type: 'value', name: '诗词数量' },
    color: THEME_COLORS,
    series: [{
        type: 'bar', data: counts,
        itemStyle: { color: '#19325F', borderRadius: [4, 4, 0, 0] },
        label: { show: true, position: 'top' },
        markLine: {
            data: [{ type: 'average', name: '平均' }],
            lineStyle: { color: '#77171C', type: 'dashed' },
            label: { formatter: '平均: {c}' }
        }
    }]
});

window.addEventListener('resize', () => {
    document.querySelectorAll('.chart').forEach(el => echarts.getInstanceByDom(el)?.resize());
});
</script>
</body>
</html>
